<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devocional">
<title>Devocional</title>
<style>
:root{--glow:#e9b872;--bg1:#3a2c1a;--bg2:#15110c}
body[data-t="tarde"]{--glow:#f0a06a;--bg1:#43271a;--bg2:#150e0b}
body[data-t="noite"]{--glow:#9aa6ff;--bg1:#22264a;--bg2:#0d0e1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:#fff;font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;padding:max(22px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom));
  background:radial-gradient(120% 55% at 50% -8%,var(--bg1) 0%,transparent 70%),var(--bg2);background-attachment:fixed;transition:background .6s}
main{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #8fd6ff;outline-offset:3px}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.ico svg{width:100%;height:100%;display:block}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:28px;margin:0;letter-spacing:-.4px;font-weight:700}
h1 .ico{color:var(--glow);margin-right:6px}
.date{color:#ffffffa6;font-size:14px;margin:2px 0 0}
.swap{background:#ffffff14;border:0;border-radius:20px;color:#ffffffc0;font-size:13px;padding:8px 14px}

.who{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0 8px}
.who button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px;border-radius:22px;border:1px solid #ffffff1f;background:#ffffff0d;backdrop-filter:blur(12px);font-size:17px;font-weight:600}
.who button:active{transform:scale(.97)}
.ask{font-size:17px;font-weight:600;margin:22px 0 0;color:#ffffffd0}
.av{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;font-weight:700;font-size:20px;color:#1a1208;background:linear-gradient(145deg,var(--c1),var(--c2))}
.av.s{width:36px;height:36px;font-size:15px}

/* the ring: it closes when the day is done */
.stage{display:grid;place-items:center;margin:26px 0 6px}
.ring{position:relative;width:196px;height:196px;border:0;background:none;padding:0;border-radius:50%;transition:transform .15s}
.ring:active{transform:scale(.96)}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:#ffffff1c;stroke-width:9}
.ring .pg{fill:none;stroke:var(--glow);stroke-width:9;stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:553;transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1),stroke .4s}
.ring.done .pg{stroke-dashoffset:0;stroke:#5fd49a}
.ring .core{position:absolute;inset:16px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#ffffff1f,#ffffff08);box-shadow:0 0 60px -10px var(--glow);transition:box-shadow .5s,background .4s}
.ring.done .core{background:radial-gradient(circle at 50% 35%,#2f9163,#1c5a3d);box-shadow:0 0 70px -6px #5fd49a}
.ring .core .ico{width:64px;height:64px;color:#fff}
.ring.done .core .ico path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .55s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cap{text-align:center;font-weight:600;font-size:17px;margin:12px 0 2px}
.hint{text-align:center;color:#ffffffa6;font-size:14px;min-height:20px;margin:0 0 6px}
.undo{display:block;margin:0 auto 14px;background:none;border:0;color:#ffffff90;text-decoration:underline;font-size:13px;padding:8px}


.tree{display:flex;align-items:center;gap:16px;margin:8px 0 14px;padding:14px 16px;border-radius:22px;background:linear-gradient(160deg,#ffffff14,#ffffff06);border:1px solid #ffffff14}
.tree img{width:92px;height:92px;flex:none;filter:drop-shadow(0 8px 18px #0008)}
.tree b{display:block;font-size:17px}
.tree span{color:#ffffffb0;font-size:14px}
.bar{height:8px;border-radius:4px;background:#ffffff1c;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#4cc27f,#9be7b5);transition:width .8s cubic-bezier(.3,.9,.3,1)}
.tree small{color:#ffffff80;font-size:12px}
.call{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;border:1px solid #ffffff40;background:#ffffff14;font-size:14px;font-weight:600;flex:none}
.call:active{transform:scale(.95)}
.alert{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;margin-top:16px;background:linear-gradient(135deg,#5a3a14,#3b2710);border:1px solid #f3cf7280;animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.alert .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f3cf72;color:#2a1d00;font-size:21px;flex:none;animation:ring 1.4s ease-in-out 2}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.crown{color:#f3cf72;margin-left:6px}
.lvl{display:block;color:#ffffffa0;font-size:12px;font-weight:500;margin-top:1px}
.pair{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#ffffff0d;border:1px solid #ffffff12;margin-bottom:10px}
.pair .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffff1a;font-size:21px;flex:none}
.pair.ok{background:#1b3a2a99;border-color:#5fd49a40}
.pair.ok .ic{background:#2e8a5c}
.pair b{display:block}
.pair span{color:#ffffffa6;font-size:14px}

.card{background:#ffffff0d;border:1px solid #ffffff12;border-radius:22px;padding:16px;margin-bottom:12px}
.card.me{border-color:#ffffff40;background:#ffffff14}
.row{display:flex;align-items:center;gap:12px}
.name{font-weight:700;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-size:12px;color:#ffffff90;font-weight:600;letter-spacing:.06em}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.fire{color:#ff9f43}
.streak .fire.live{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.1) rotate(-3deg)}60%{transform:scale(.96) rotate(2deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-align:center}
.day i{display:block;height:12px;border-radius:6px;background:#ffffff1c}
.day.y i{background:linear-gradient(90deg,#4cc27f,#7be0a6)}
.day.t i{box-shadow:0 0 0 2px #ffffff55}
.day em{display:block;font-style:normal;font-size:11px;color:#ffffff80;margin-top:5px}
.meta{color:#ffffff90;font-size:13px;margin-top:12px}
.marks{display:flex;gap:8px;margin-top:12px}
.mk{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:#ffffff0a;color:#ffffff60;font-size:11px}
.mk b{font-size:16px}
.mk.on{background:linear-gradient(160deg,#f3cf72,#c9962f);color:#2a1d00}

details{margin-top:22px;border-top:1px solid #ffffff18;padding-top:6px}
summary{color:#ffffffa0;font-size:14px;padding:10px 0;cursor:pointer}
form{display:flex;gap:8px;margin:6px 0 14px}
input{flex:1;min-width:0;padding:13px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff0d;color:#fff;font-size:16px}
form button{padding:0 18px;border-radius:14px;border:0;background:#ffffff26;font-weight:600}
.rm{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.rm button{background:none;border:1px solid #ff6b6b66;color:#ff9a9a;border-radius:10px;padding:6px 12px;font-size:13px}
.err{color:#ff8a8a;text-align:center;font-size:14px;min-height:20px;margin-top:12px}
.conn{position:fixed;left:0;right:0;bottom:0;background:#6b2a2a;text-align:center;padding:10px;font-size:14px;transform:translateY(110%);transition:transform .2s}
.conn.on{transform:none}

.burst{position:fixed;left:50%;top:34%;pointer-events:none;z-index:9}
.burst span{position:absolute;width:26px;height:26px;margin:-13px;animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.15) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.ring *,.streak .fire.live{animation:none!important;transition:none!important}.ring.done .core .ico path{stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 id="hello"></h1><p class="date" id="date"></p></div>
    <button class="swap" id="swap" hidden>Trocar</button>
  </div>

  <div id="nudged"></div>

  <section id="pick" hidden>
    <p class="ask" id="ask">Quem é você?</p>
    <div class="who" id="who"></div>
  </section>

  <section id="mine" hidden>
    <div class="stage">
      <button class="ring" id="big" aria-label="Registrar o devocional de hoje">
        <svg class="r" viewBox="0 0 200 200" aria-hidden="true"><circle class="tr" cx="100" cy="100" r="88"/><circle class="pg" cx="100" cy="100" r="88"/></svg>
        <span class="core" id="core"></span>
      </button>
    </div>
    <p class="cap" id="cap"></p>
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="undo" id="yday" hidden></button>
  </section>

  <section class="tree" id="tree" hidden>
    <img id="timg" alt="" width="92" height="92">
    <div style="flex:1;min-width:0"><b id="tname"></b><span id="tpts"></span><div class="bar"><i id="tbar"></i></div><small id="tnext"></small></div>
  </section>

  <div id="pairs"></div>
  <div id="rank"></div>

  <details id="more">
    <summary>Ajustes</summary>
    <form id="add"><input id="nm" placeholder="Adicionar pessoa" maxlength="20" autocomplete="off" aria-label="Nome"><button>Adicionar</button></form>
    <div id="rm"></div>
  </details>
  <p class="err" id="err" role="alert"></p>
</main>
<div class="conn" id="conn">Sem conexão com a TV. Confira se está no mesmo Wi-Fi.</div>
<script>
'use strict';
var S = null, me = localStorage.getItem('eu'), busy = false;
var PATHS = {
  flame: '<path fill="currentColor" d="M12 2c.8 3.6 6 5.8 6 11.5A6 6 0 0 1 6 13.5c0-2.6 1.4-4 2.6-5.6.4 1.2 1 2 1.9 2.5C10.6 7 11 4.4 12 2z"/>',
  check: '<path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/>',
  clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5.2l3.2 2"/>',
  heart: '<path fill="currentColor" d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/>',
  cross: '<path fill="currentColor" d="M10 2.5h4V8h5.5v4H14v9.5h-4V12H4.5V8H10z"/>',
  book: '<path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M12 6.5C10 5 7 4.6 4 5v13c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5zM12 6.5v13"/>',
  bell: '<path fill="currentColor" d="M12 2.5a1.6 1.6 0 0 1 1.6 1.6v.6A6 6 0 0 1 18 10.5v3.2l1.7 2.6c.4.6 0 1.4-.8 1.4H5.1c-.8 0-1.2-.8-.8-1.4L6 13.7v-3.2a6 6 0 0 1 4.4-5.8v-.6A1.6 1.6 0 0 1 12 2.5zM9.8 19h4.4a2.2 2.2 0 0 1-4.4 0z"/>',
  crown: '<path fill="currentColor" d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.8 10H4.8L3 8zm2.2 11.5h13.6V21H5.2v-1.5z"/>',
  spark: '<path fill="currentColor" d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/>'
};
var MARKS = [7, 30, 100, 365];
var PALETTE = [['#f3cf72', '#e08f3c'], ['#9fd9c3', '#4aa88a'], ['#b9b3ff', '#7a6fe0'], ['#ffb3b3', '#e06c7c']];
function $(i){ return document.getElementById(i); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ico(name, cls){ var e = el('span', 'ico' + (cls ? ' ' + cls : '')); e.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + PATHS[name] + '</svg>'; return e; }
function avatar(p, small){
  var i = S.people.indexOf(person(p.id)), c = PALETTE[Math.max(i, 0) % PALETTE.length];
  var a = el('span', 'av' + (small ? ' s' : ''), p.name.charAt(0).toUpperCase());
  a.style.setProperty('--c1', c[0]); a.style.setProperty('--c2', c[1]); return a;
}
function iso(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function noon(s){ return new Date(s + 'T12:00:00'); }
function person(id){ return S && S.people.filter(function(p){ return p.id === id; })[0]; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function sky(){ var h = new Date().getHours(); document.body.dataset.t = h < 12 ? 'manha' : h < 18 ? 'tarde' : 'noite'; }

function api(path, body){
  var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' };
  return fetch(path, opt).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}
function online(ok){ $('conn').classList.toggle('on', !ok); }
function load(){
  if (busy) return;
  api('/state').then(function(s){ S = s; online(true); draw(); }).catch(function(){ online(false); });
}
function setMe(id){ me = id; if (id) localStorage.setItem('eu', id); else localStorage.removeItem('eu'); draw(); }

function celebrate(big){
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  var b = el('div', 'burst'); document.body.appendChild(b);
  ['flame', 'spark', 'heart', 'spark', 'flame', 'spark', 'heart', 'spark', 'flame', 'spark'].forEach(function(c, i, all){
    var s = ico(c), a = (i / all.length) * Math.PI * 2;
    s.style.color = ['#ff9f43', '#ffd166', '#ff7a90', '#9be7b5'][i % 4];
    s.style.setProperty('--x', Math.round(Math.cos(a) * 130) + 'px');
    s.style.setProperty('--y', Math.round(Math.sin(a) * 130 - 20) + 'px');
    b.appendChild(s);
  });
  setTimeout(function(){ b.remove(); }, 1100);
  if (big) setTimeout(function(){ celebrate(false); }, 350);
}

function message(p, justDone){
  var other = S.people.filter(function(o){ return o.id !== p.id; });
  if (!p.doneToday) return other.some(function(o){ return o.doneToday; }) ? 'Já fizeram o devocional hoje. Falta você.' : 'Um momento com Deus antes de dormir também vale.';
  if (justDone && MARKS.indexOf(p.streak) >= 0) return 'Marco de ' + p.streak + ' dias alcançado! Que fidelidade.';
  if (p.streak >= 2) return 'Que bênção! ' + plural(p.streak, 'dia seguido', 'dias seguidos') + '.';
  return justDone ? 'Que bênção! Primeiro dia da sequência.' : 'Feito por hoje. Até amanhã!';
}

function draw(justDone){
  sky();
  var t = noon(S.today);
  var ds = t.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  var m = person(me);
  if (!m && me) { me = null; localStorage.removeItem('eu'); }

  $('pick').hidden = !!m;
  $('ask').textContent = S.people.length ? 'Quem é você?' : 'Bem-vindos! Comece adicionando um nome nos Ajustes abaixo.';
  var who = $('who'); who.textContent = '';
  S.people.forEach(function(p){ var b = el('button'); b.appendChild(avatar(p)); b.appendChild(document.createTextNode(p.name)); b.onclick = function(){ setMe(p.id); }; who.appendChild(b); });
  $('swap').hidden = !m;
  var h = $('hello'); h.textContent = '';
  if (m) h.textContent = 'Olá, ' + m.name; else { h.appendChild(ico('cross')); h.appendChild(document.createTextNode('Devocional')); }

  $('mine').hidden = !m;
  if (m) {
    var big = $('big'); big.className = 'ring' + (m.doneToday ? ' done' : '');
    var core = $('core'); core.textContent = ''; core.appendChild(ico(m.doneToday ? 'check' : 'book'));
    $('cap').textContent = m.doneToday ? 'Devocional de hoje feito' : 'Toque para registrar';
    var y = $('yday'), ydone = m.week[5];
    y.hidden = false; y.textContent = ydone ? 'Ontem: feito (desfazer)' : 'Esqueci de marcar ontem';
    $('hint').textContent = message(m, justDone);
    big.setAttribute('aria-pressed', m.doneToday ? 'true' : 'false');
  }

  // The others and the couple
  var pairs = $('pairs'); pairs.textContent = '';
  if (m) S.people.filter(function(o){ return o.id !== m.id; }).forEach(function(o){
    var d = el('div', 'pair' + (o.doneToday ? ' ok' : ''));
    var ic = el('div', 'ic'); ic.appendChild(ico(o.doneToday ? 'check' : 'clock')); d.appendChild(ic);
    var c = el('div'); c.appendChild(el('b', null, o.doneToday ? o.name + ' já fez hoje' : o.name + ' ainda não fez hoje'));
    c.appendChild(el('span', null, plural(o.streak, 'dia seguido', 'dias seguidos')));
    d.appendChild(c);
    if (!o.doneToday) {
      var call = el('button', 'call'); call.appendChild(ico('bell')); call.appendChild(document.createTextNode('Chamar'));
      call.onclick = function(){
        api('/nudge', { from: m.id, to: o.id }).then(function(s2){ S = s2; draw(); $('hint').textContent = 'Chamei ' + o.name + '.'; })
          .catch(function(){ $('err').textContent = 'Você já chamou ' + o.name + ' agora há pouco. Espere um pouco.'; });
      };
      d.appendChild(call);
    }
    pairs.appendChild(d);
  });
  if (S.people.length > 1 && S.together > 0) {
    var tg = el('div', 'pair ok'); var tic = el('div', 'ic'); tic.appendChild(ico('heart')); tg.appendChild(tic);
    var tc = el('div'); tc.appendChild(el('b', null, 'Vocês juntos: ' + plural(S.together, 'dia', 'dias')));
    tc.appendChild(el('span', null, 'Todos fizeram, dia após dia')); tg.appendChild(tc); pairs.appendChild(tg);
  }

  // The week's duel
  if (S.people.length > 1) {
    var lead = S.weekLeader && person(S.weekLeader), top = Math.max.apply(null, S.people.map(function(p){ return p.weekCount; }));
    if (lead || top > 0) {
      var du = el('div', 'pair'); var dic = el('div', 'ic'); dic.appendChild(ico('crown')); du.appendChild(dic);
      var dc = el('div');
      dc.appendChild(el('b', null, lead ? 'Na frente esta semana: ' + lead.name : 'Semana empatada'));
      dc.appendChild(el('span', null, 'Quem fizer mais dias até domingo leva a coroa'));
      du.appendChild(dc); pairs.appendChild(du);
    }
  }

  // Someone called me
  var nd = $('nudged'); nd.textContent = '';
  if (m && m.nudgedBy && !m.doneToday) {
    var al = el('div', 'alert'); var aic = el('div', 'ic'); aic.appendChild(ico('bell')); al.appendChild(aic);
    var ac = el('div'); ac.appendChild(el('b', null, m.nudgedBy + ' te chamou')); ac.appendChild(el('span', null, 'Hora do devocional de hoje'));
    ac.firstChild.style.display = 'block'; al.appendChild(ac); nd.appendChild(al);
  }

  // The couple's tree grows with everyone's points
  var tr = $('tree'); tr.hidden = !(S.tree && S.people.length);
  if (S.tree) {
    var src = '/tree.svg?stage=' + S.tree.stage; if ($('timg').getAttribute('src') !== src) $('timg').setAttribute('src', src);
    $('tname').textContent = 'Árvore de vocês: ' + S.tree.name;
    $('tpts').textContent = plural(S.tree.points, 'ponto', 'pontos') + ' juntos';
    var span = S.tree.next ? S.tree.next - S.tree.from : 1;
    $('tbar').style.width = (S.tree.next ? Math.min(100, Math.round((S.tree.points - S.tree.from) / span * 100)) : 100) + '%';
    $('tnext').textContent = S.tree.next ? 'Faltam ' + (S.tree.next - S.tree.points) + ' para crescer' : 'Está no auge. Que lindo de ver.';
  }

  // Ranking
  var rank = $('rank'); rank.textContent = '';
  S.people.forEach(function(p, i){
    var c = el('div', 'card' + (p.id === me ? ' me' : ''));
    var r = el('div', 'row');
    r.appendChild(avatar(p, true));
    var nm = el('div', 'name'); nm.appendChild(document.createTextNode(p.name));
    if (S.weekLeader === p.id) nm.appendChild(ico('crown', 'crown'));
    nm.appendChild(el('span', 'lvl', p.level + ' · ' + plural(p.points, 'ponto', 'pontos'))); r.appendChild(nm);
    var st = el('span', 'streak'); st.appendChild(ico('flame', 'fire' + (p.streak > 0 ? ' live' : ''))); st.appendChild(document.createTextNode(String(p.streak))); r.appendChild(st);
    c.appendChild(r);
    var w = el('div', 'week');
    p.week.forEach(function(d, k){
      var day = noon(S.today); day.setDate(day.getDate() - (6 - k));
      var cell = el('div', 'day' + (d ? ' y' : '') + (k === 6 ? ' t' : ''));
      cell.appendChild(el('i')); cell.appendChild(el('em', null, day.toLocaleDateString('pt-BR', { weekday: 'narrow' }).toUpperCase()));
      cell.setAttribute('aria-label', day.toLocaleDateString('pt-BR', { weekday: 'long' }) + (d ? ': feito' : ': não feito'));
      w.appendChild(cell);
    });
    c.appendChild(w);
    var marks = el('div', 'marks');
    [7, 30, 100, 365].forEach(function(n){
      var k = el('div', 'mk' + (p.best >= n ? ' on' : '')); k.appendChild(el('b', null, String(n))); k.appendChild(el('span', null, 'dias'));
      k.setAttribute('aria-label', 'Marco de ' + n + ' dias' + (p.best >= n ? ' alcançado' : ''));
      marks.appendChild(k);
    });
    c.appendChild(marks);
    c.appendChild(el('div', 'meta', 'Esta semana ' + plural(p.weekCount, 'dia', 'dias') + ' · melhor sequência ' + p.best + ' · ' + p.total + ' no total'));
    rank.appendChild(c);
  });

  $('add').hidden = S.people.length >= 4;
  if (!S.people.length) $('more').open = true;
  var rm = $('rm'); rm.textContent = '';
  S.people.forEach(function(p){
    var row = el('div', 'rm'); row.appendChild(el('span', null, p.name));
    var b = el('button', null, 'Remover');
    b.onclick = function(){
      if (!confirm('Remover ' + p.name + ' e todo o histórico dessa pessoa?')) return;
      send('/people', { remove: p.id }).then(function(){ if (me === p.id) setMe(null); });
    };
    row.appendChild(b); rm.appendChild(row);
  });
}

// Taps answer at once and are corrected if the TV refuses or cannot be reached
function send(path, body, optimistic){
  busy = true; $('err').textContent = '';
  var before = JSON.stringify(S);
  if (optimistic) { optimistic(); draw(); }
  return api(path, body).then(function(s){ S = s; online(true); busy = false; draw(true); return s; })
    .catch(function(){ busy = false; S = JSON.parse(before); draw(); $('err').textContent = 'Não consegui falar com a TV. Tente de novo.'; online(false); throw 0; });
}
function toggle(date, done, key){
  var m = person(me); if (!m) return Promise.resolve();
  return send('/checkin', { id: m.id, date: date, done: done }, function(){
    if (key === 'today') { m.doneToday = done; m.week[6] = done; m.total += done ? 1 : -1; m.streak = done ? m.streak + 1 : Math.max(m.streak - 1, 0); m.best = Math.max(m.best, m.streak); }
    else { m.week[5] = done; m.total += done ? 1 : -1; }
  });
}
$('big').onclick = function(){
  var m = person(me); if (!m) return;
  var done = !m.doneToday;
  toggle(S.today, done, 'today').then(function(){ if (done) celebrate(MARKS.indexOf((person(me) || {}).streak) >= 0); }).catch(function(){});
};
$('yday').onclick = function(){
  var m = person(me); if (!m) return;
  var d = noon(S.today); d.setDate(d.getDate() - 1);
  toggle(iso(d), !m.week[5], 'yday').catch(function(){});
};
$('swap').onclick = function(){ setMe(null); };
$('add').onsubmit = function(e){
  e.preventDefault();
  var n = $('nm').value.trim(); if (!n) return;
  var first = !S.people.length;
  send('/people', { name: n }).then(function(s){
    $('nm').value = '';
    if (!me) { var added = s.people.filter(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })[0]; if (added && first) setMe(added.id); }
  }).catch(function(){ $('err').textContent = 'Esse nome já existe ou o limite de 4 pessoas foi atingido.'; });
};
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
window.addEventListener('online', load);
load(); setInterval(load, 10000);
</script>
