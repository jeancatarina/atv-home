<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devocional">
<title>Devocional</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#111}
body{margin:0;color:#fff;font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;padding:max(22px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8fd6ff;outline-offset:2px}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.ico svg{width:100%;height:100%;display:block}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#ffffff26;color:#fff;font-size:14px;font-weight:700}
.rank.r0{background:#e2b53c;color:#2b2100}.rank.r1{background:#c4c8cf;color:#1d2024}.rank.r2{background:#c58355;color:#2a1608}
.pair .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffff1a;font-size:22px}
.pair.ok .ic{background:#2e7d4f}
.fire{color:#ff9f43}.big .ico{margin-right:8px}
.streak{display:inline-flex;align-items:center;gap:4px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
.date{color:#ffffffa0;font-size:14px;margin:2px 0 20px}
.swap{background:none;border:0;color:#ffffffb0;text-decoration:underline;font-size:14px;padding:8px 0}

.who{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.who button{padding:18px 10px;border-radius:16px;border:2px solid #ffffff26;background:#1c1c1e;font-size:18px;font-weight:600}
.who button:active{transform:scale(.97)}
.ask{font-size:18px;font-weight:600;margin:0 0 12px}

.big{position:relative;width:100%;min-height:86px;padding:20px;border-radius:22px;border:0;background:#fff;color:#000;font-size:21px;font-weight:700;transition:transform .12s,background .25s}
.big:active{transform:scale(.98)}
.big.done{background:#1f6b43;color:#fff}
.big small{display:block;font-size:14px;font-weight:500;opacity:.85;margin-top:2px}
.undo{display:block;margin:6px auto 0;background:none;border:0;color:#ffffffa0;text-decoration:underline;font-size:14px;padding:10px}
.hint{text-align:center;color:#ffffffa0;font-size:14px;min-height:20px;margin:10px 0 18px}

.pair{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#1c1c1e;margin-bottom:10px}
.pair b{display:block}
.pair span{color:#ffffffa0;font-size:14px}
.pair.ok{background:#16301f}

.card{background:#1c1c1e;border-radius:18px;padding:14px 16px;margin-bottom:10px}
.card.me{box-shadow:inset 0 0 0 2px #ffffff40}
.row{display:flex;align-items:center;gap:10px}
.pos{font-size:22px;width:30px;text-align:center}
.name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{font-weight:700;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}
.day i{display:block;height:12px;border-radius:6px;background:#ffffff1f}
.day.y i{background:#4cc27f}
.day.t i{box-shadow:0 0 0 2px #ffffff55}
.day em{display:block;font-style:normal;font-size:11px;color:#ffffff80;margin-top:4px}
.meta{color:#ffffff90;font-size:13px;margin-top:10px}

details{margin-top:22px;border-top:1px solid #ffffff1a;padding-top:6px}
summary{color:#ffffffa0;font-size:14px;padding:10px 0;cursor:pointer}
form{display:flex;gap:8px;margin:6px 0 14px}
input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #ffffff33;background:#1c1c1e;color:#fff;font-size:16px}
form button{padding:0 16px;border-radius:12px;border:0;background:#ffffff26;font-weight:600}
.rm{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.rm button{background:none;border:1px solid #ff6b6b66;color:#ff9a9a;border-radius:10px;padding:6px 12px;font-size:13px}
.err{color:#ff8a8a;text-align:center;font-size:14px;min-height:20px;margin-top:12px}
.conn{position:fixed;left:0;right:0;bottom:0;background:#6b2a2a;text-align:center;padding:10px;font-size:14px;transform:translateY(110%);transition:transform .2s}
.conn.on{transform:none}

.burst{position:fixed;left:50%;top:40%;pointer-events:none;z-index:9}
.burst span{position:absolute;width:28px;height:28px;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.big,.who button{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="hello"></h1><button class="swap" id="swap" hidden>Trocar pessoa</button></div>
  <p class="date" id="date"></p>

  <section id="pick" hidden>
    <p class="ask" id="ask">Quem é você?</p>
    <div class="who" id="who"></div>
  </section>

  <section id="mine" hidden>
    <button class="big" id="big"></button>
    <button class="undo" id="yday" hidden></button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <div id="pairs"></div>
  <div id="rank"></div>

  <details id="more">
    <summary>Ajustes</summary>
    <form id="add"><input id="nm" placeholder="Adicionar pessoa" maxlength="20" autocomplete="off" aria-label="Nome"><button>Adicionar</button></form>
    <div id="rm"></div>
  </details>
  <p class="err" id="err" role="alert"></p>
</main>
<div class="conn" id="conn">Sem conexão com a TV. Confira se está no mesmo Wi-Fi.</div>
<script>
'use strict';
var S = null, me = localStorage.getItem('eu'), busy = false;
var PATHS = {
  flame: '<path fill="currentColor" d="M12 2c.8 3.6 6 5.8 6 11.5A6 6 0 0 1 6 13.5c0-2.6 1.4-4 2.6-5.6.4 1.2 1 2 1.9 2.5C10.6 7 11 4.4 12 2z"/>',
  check: '<path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/>',
  clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5.2l3.2 2"/>',
  heart: '<path fill="currentColor" d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/>',
  cross: '<path fill="currentColor" d="M10 2.5h4V8h5.5v4H14v9.5h-4V12H4.5V8H10z"/>',
  spark: '<path fill="currentColor" d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/>'
};
function ico(name, cls){ var e = el('span', 'ico' + (cls ? ' ' + cls : '')); e.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + PATHS[name] + '</svg>'; return e; }
function $(i){ return document.getElementById(i); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function iso(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function noon(s){ return new Date(s + 'T12:00:00'); }
function person(id){ return S && S.people.filter(function(p){ return p.id === id; })[0]; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }

function api(path, body){
  var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' };
  return fetch(path, opt).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}
function online(ok){ $('conn').classList.toggle('on', !ok); }
function load(){
  if (busy) return;
  api('/state').then(function(s){ S = s; online(true); draw(); }).catch(function(){ online(false); });
}
function setMe(id){ me = id; if (id) localStorage.setItem('eu', id); else localStorage.removeItem('eu'); draw(); }

function celebrate(){
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  var b = el('div', 'burst'); document.body.appendChild(b);
  ['flame', 'spark', 'heart', 'spark', 'flame', 'spark', 'heart', 'spark'].forEach(function(c, i){
    var s = ico(c, i % 4 === 0 ? 'fire' : ''), a = (i / 8) * Math.PI * 2;
    s.style.color = ['#ff9f43', '#ffd166', '#ff7a90', '#9be7b5'][i % 4];
    s.style.setProperty('--x', Math.round(Math.cos(a) * 120) + 'px');
    s.style.setProperty('--y', Math.round(Math.sin(a) * 120 - 40) + 'px');
    b.appendChild(s);
  });
  setTimeout(function(){ b.remove(); }, 1000);
}

function message(p, justDone){
  var other = S.people.filter(function(o){ return o.id !== p.id; });
  if (!p.doneToday) return other.some(function(o){ return o.doneToday; }) ? 'Já fizeram o devocional hoje. Falta você.' : 'Um momento com Deus antes de dormir também vale.';
  if (p.streak >= 2) return 'Que bênção! ' + plural(p.streak, 'dia seguido', 'dias seguidos') + '.';
  return justDone ? 'Que bênção! Primeiro dia da sequência.' : 'Feito por hoje. Até amanhã!';
}

function draw(justDone){
  var t = noon(S.today);
  var ds = t.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  var m = person(me);
  if (!m && me) { me = null; localStorage.removeItem('eu'); }

  // Who am I: asked once, then folded into the greeting
  $('pick').hidden = !!m;
  $('ask').textContent = S.people.length ? 'Quem é você?' : 'Bem-vindos! Comece adicionando um nome nos Ajustes abaixo.';
  var who = $('who'); who.textContent = '';
  S.people.forEach(function(p){ var b = el('button', null, p.name); b.onclick = function(){ setMe(p.id); }; who.appendChild(b); });
  $('swap').hidden = !m;
  var h = $('hello'); h.textContent = '';
  if (m) h.textContent = 'Olá, ' + m.name; else { h.appendChild(ico('cross')); h.appendChild(document.createTextNode(' Devocional')); }

  $('mine').hidden = !m;
  if (m) {
    var big = $('big'); big.textContent = '';
    big.className = 'big' + (m.doneToday ? ' done' : '');
    if (m.doneToday) big.appendChild(ico('check'));
    big.appendChild(document.createTextNode(m.doneToday ? 'Devocional de hoje feito' : 'Fiz o devocional hoje'));
    big.appendChild(el('small', null, m.doneToday ? 'Toque aqui só se marcou sem querer' : 'Um toque e a TV já mostra'));
    var y = $('yday'), ydone = m.week[5];
    y.hidden = false; y.textContent = ydone ? 'Ontem: feito (desfazer)' : 'Esqueci de marcar ontem';
    $('hint').textContent = message(m, justDone);
  }

  // The others and the couple: the nudge is in seeing how the other is doing
  var pairs = $('pairs'); pairs.textContent = '';
  if (m) S.people.filter(function(o){ return o.id !== m.id; }).forEach(function(o){
    var d = el('div', 'pair' + (o.doneToday ? ' ok' : ''));
    var ic = el('div', 'ic'); ic.appendChild(ico(o.doneToday ? 'check' : 'clock')); d.appendChild(ic);
    var c = el('div'); c.appendChild(el('b', null, o.doneToday ? o.name + ' já fez hoje' : o.name + ' ainda não fez hoje'));
    c.appendChild(el('span', null, plural(o.streak, 'dia seguido', 'dias seguidos')));
    d.appendChild(c); pairs.appendChild(d);
  });
  if (S.people.length > 1 && S.together > 0) {
    var tg = el('div', 'pair ok'); var tic = el('div', 'ic'); tic.appendChild(ico('heart')); tg.appendChild(tic);
    var tc = el('div'); tc.appendChild(el('b', null, 'Vocês juntos: ' + plural(S.together, 'dia', 'dias')));
    tc.appendChild(el('span', null, 'Todos fizeram, dia após dia')); tg.appendChild(tc); pairs.appendChild(tg);
  }

  // Ranking with the week as weekday letters
  var rank = $('rank'); rank.textContent = '';
  S.people.forEach(function(p, i){
    var c = el('div', 'card' + (p.id === me ? ' me' : ''));
    var r = el('div', 'row');
    r.appendChild(el('span', 'pos', null)); r.lastChild.appendChild(el('span', 'rank' + (i < 3 ? ' r' + i : ''), String(i + 1)));
    r.appendChild(el('span', 'name', p.name));
    var st = el('span', 'streak'); st.appendChild(ico('flame', 'fire')); st.appendChild(document.createTextNode(String(p.streak))); r.appendChild(st);
    c.appendChild(r);
    var w = el('div', 'week');
    p.week.forEach(function(d, k){
      var day = noon(S.today); day.setDate(day.getDate() - (6 - k));
      var cell = el('div', 'day' + (d ? ' y' : '') + (k === 6 ? ' t' : ''));
      cell.appendChild(el('i')); cell.appendChild(el('em', null, day.toLocaleDateString('pt-BR', { weekday: 'narrow' }).toUpperCase()));
      cell.setAttribute('aria-label', day.toLocaleDateString('pt-BR', { weekday: 'long' }) + (d ? ': feito' : ': não feito'));
      w.appendChild(cell);
    });
    c.appendChild(w);
    c.appendChild(el('div', 'meta', 'Melhor sequência ' + p.best + ' · ' + p.last30 + ' dos últimos 30 dias · ' + p.total + ' no total'));
    rank.appendChild(c);
  });

  // Settings: add and remove people
  $('add').hidden = S.people.length >= 4;
  if (!S.people.length) $('more').open = true;
  var rm = $('rm'); rm.textContent = '';
  S.people.forEach(function(p){
    var row = el('div', 'rm'); row.appendChild(el('span', null, p.name));
    var b = el('button', null, 'Remover');
    b.onclick = function(){
      if (!confirm('Remover ' + p.name + ' e todo o histórico dessa pessoa?')) return;
      send('/people', { remove: p.id }).then(function(){ if (me === p.id) setMe(null); });
    };
    row.appendChild(b); rm.appendChild(row);
  });
}

// Taps answer at once and are corrected if the TV refuses or cannot be reached
function send(path, body, optimistic){
  busy = true; $('err').textContent = '';
  var before = JSON.stringify(S);
  if (optimistic) { optimistic(); draw(); }
  return api(path, body).then(function(s){ S = s; online(true); busy = false; draw(true); return s; })
    .catch(function(){ busy = false; S = JSON.parse(before); draw(); $('err').textContent = 'Não consegui falar com a TV. Tente de novo.'; online(false); throw 0; });
}
function toggle(date, done, key){
  var m = person(me); if (!m) return Promise.resolve();
  return send('/checkin', { id: m.id, date: date, done: done }, function(){
    if (key === 'today') { m.doneToday = done; m.week[6] = done; m.total += done ? 1 : -1; m.streak = done ? m.streak + 1 : Math.max(m.streak - 1, 0); }
    else { m.week[5] = done; m.total += done ? 1 : -1; }
  });
}
$('big').onclick = function(){
  var m = person(me); if (!m) return;
  var done = !m.doneToday;
  toggle(S.today, done, 'today').then(function(){ if (done) celebrate(); }).catch(function(){});
};
$('yday').onclick = function(){
  var m = person(me); if (!m) return;
  var d = noon(S.today); d.setDate(d.getDate() - 1);
  toggle(iso(d), !m.week[5], 'yday').catch(function(){});
};
$('swap').onclick = function(){ setMe(null); };
$('add').onsubmit = function(e){
  e.preventDefault();
  var n = $('nm').value.trim(); if (!n) return;
  var first = !S.people.length;
  send('/people', { name: n }).then(function(s){
    $('nm').value = '';
    if (!me) { var added = s.people.filter(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })[0]; if (added && first) setMe(added.id); }
  }).catch(function(){ $('err').textContent = 'Esse nome já existe ou o limite de 4 pessoas foi atingido.'; });
};
// Coming back to the page (screen unlocked, tab switched) shows what the other did meanwhile
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
window.addEventListener('online', load);
load(); setInterval(load, 10000);
</script>
</body>
</html>
