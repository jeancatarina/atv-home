<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devocional">
<title>Devocional</title>
<style>
:root{
  --bg:#0f0e0c;--ink:#f3eee4;--mute:#a49d90;--faint:#6f695f;--line:#ffffff17;--brass:#c9a96b;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding:max(28px,env(safe-area-inset-top)) 24px max(48px,env(safe-area-inset-bottom))}
main{max-width:440px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:4px}
.ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.ico svg{width:100%;height:100%;display:block}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{font:500 32px/1.12 var(--serif);letter-spacing:-.01em;margin:8px 0 6px}
.date{color:var(--mute);font-size:14px;margin:0}
.link{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:26px 0 0}

/* who */
.who{display:grid;gap:0;margin-top:26px;border-top:1px solid var(--line)}
.who button{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 2px;border-bottom:1px solid var(--line);font:500 20px var(--serif)}
.who button:active{opacity:.6}
.mono{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--faint);font:500 17px var(--serif);color:var(--ink);flex:none}
.mono.s{width:34px;height:34px;font-size:15px}

/* check-in */
.stage{display:flex;flex-direction:column;align-items:center;margin:34px 0 4px}
.ring{position:relative;width:148px;height:148px;border-radius:50%;transition:transform .2s}
.ring:active{transform:scale(.97)}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .tr{fill:none;stroke:var(--faint);stroke-width:1}
.ring .fl{fill:var(--brass);opacity:0;transition:opacity .45s}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);transition:color .3s}
.ring .mid .ico{width:34px;height:34px}
.ring.done .fl{opacity:1}
.ring.done .mid{color:#17130b}
.ring.done .mid path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cap{margin:18px 0 0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.hint{text-align:center;color:var(--mute);font-size:14px;min-height:21px;margin:6px 0 0}
.undo{display:block;margin:6px auto 0}

.note{display:flex;gap:12px;align-items:flex-start;margin-top:26px;padding:14px 0 14px 16px;border-left:2px solid var(--brass)}
.note .ico{color:var(--brass);margin-top:3px}
.note b{display:block;font:500 17px var(--serif)}
.note span{color:var(--mute);font-size:14px}

/* people */
.person{padding:22px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:24px}
.head{display:flex;align-items:center;gap:14px}
.who2{flex:1;min-width:0}
.nm{font:500 22px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.sub .ok{color:var(--brass)}
.streak{text-align:right;line-height:1}
.streak .num{font-size:38px;font-weight:400}
.streak small{display:block;margin-top:4px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.week{display:flex;justify-content:space-between;margin:18px 2px 0 48px}
.day{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;color:var(--faint);letter-spacing:.08em}
.day i{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint)}
.day.y i{background:var(--brass);border-color:var(--brass)}
.day.t{color:var(--mute)}
.foot{display:flex;justify-content:space-between;align-items:center;margin:14px 0 0 48px;font-size:12px;color:var(--faint)}
.call{display:inline-flex;align-items:center;gap:6px;color:var(--brass);font-size:13px;font-weight:600;letter-spacing:.02em;padding:6px 0}
.call:active{opacity:.6}

.both{display:block;margin:16px auto 0;padding:11px 22px;border:1px solid var(--brass);border-radius:30px;color:var(--brass);font-size:13px;font-weight:600;letter-spacing:.04em}
.both:active{opacity:.6}
.nextr{margin:18px 0 0;color:var(--mute);font-size:13px}
.nextr b{color:var(--ink);font-weight:500}
.note .call{margin-left:auto}
.rwrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.rwrow input{flex:1;text-align:right;padding:4px 0;font-size:15px;color:var(--ink)}
.sect{margin:22px 0 4px}
/* the pair */
.duo{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.duo div{padding:18px 0}
.duo div+div{padding-left:20px;border-left:1px solid var(--line)}
.duo .num{font-size:30px;line-height:1.1}
.duo small{display:block;margin-top:4px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

.tree{display:flex;align-items:center;gap:18px;margin-top:26px}
.tree img{width:104px;height:104px;flex:none;opacity:.95}
.tree .nm2{font:500 21px/1.2 var(--serif);margin:5px 0 12px}
.bar{height:2px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .8s cubic-bezier(.3,.9,.3,1)}
.tree small{display:block;color:var(--faint);font-size:12px;margin-top:8px}

details{margin-top:34px;border-top:1px solid var(--line);padding-top:4px}
summary{color:var(--mute);font-size:13px;padding:14px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
form{display:flex;gap:10px;margin:4px 0 8px;border-bottom:1px solid var(--faint)}
input{flex:1;min-width:0;padding:12px 0;border:0;background:none;color:var(--ink);font-size:16px;outline-offset:6px}
input::placeholder{color:var(--faint)}
form button{color:var(--brass);font-weight:600;font-size:14px;padding:0 2px}
.rm{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px;border-bottom:1px solid var(--line)}
.rm button{color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.err{color:#d98b7a;text-align:center;font-size:13px;min-height:20px;margin-top:16px}
.conn{position:fixed;left:0;right:0;bottom:0;background:#2a1f1a;border-top:1px solid #5a3d33;text-align:center;padding:11px;font-size:13px;color:#e8c9bd;transform:translateY(110%);transition:transform .2s}
.conn.on{transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ring.done .mid path{stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">Devocional</div>
      <h1 id="hello"></h1>
      <p class="date" id="date"></p>
    </div>
    <button class="link" id="swap" hidden>Trocar</button>
  </header>

  <section id="pick" hidden>
    <div class="who" id="who"></div>
  </section>

  <div id="nudged"></div>

  <section id="mine" hidden>
    <div class="stage">
      <button class="ring" id="big" aria-label="Registrar o devocional de hoje">
        <svg viewBox="0 0 148 148" aria-hidden="true"><circle class="tr" cx="74" cy="74" r="73"/><circle class="fl" cx="74" cy="74" r="73"/></svg>
        <span class="mid" id="core"></span>
      </button>
      <p class="cap" id="cap"></p>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="both" id="tog" hidden>Fizemos juntos</button>
    <button class="link undo" id="yday" hidden></button>
  </section>

  <hr>
  <div id="people"></div>
  <div class="duo" id="duo" hidden></div>
  <div id="rewards"></div>

  <hr>
  <section class="tree" id="tree" hidden>
    <img id="timg" alt="" width="104" height="104">
    <div style="flex:1;min-width:0">
      <div class="eyebrow">Árvore de vocês</div>
      <div class="nm2" id="tname"></div>
      <div class="bar"><i id="tbar"></i></div>
      <small id="tnext"></small>
    </div>
  </section>

  <details id="more">
    <summary>Ajustes</summary>
    <form id="add"><input id="nm" placeholder="Adicionar pessoa" maxlength="20" autocomplete="off" aria-label="Nome"><button>Adicionar</button></form>
    <div id="rm"></div>
    <div id="rw"></div>
  </details>
  <p class="err" id="err" role="alert"></p>
</main>
<div class="conn" id="conn">Sem conexão com a TV. Confira se está no mesmo Wi-Fi.</div>
<script>
'use strict';
var S = null, me = localStorage.getItem('eu'), busy = false;
var MARKS = [7, 30, 100, 365];
var PATHS = {
  check: '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/>',
  book: '<path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" d="M12 6.5C10 5 7 4.6 4 5v13c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5zM12 6.5v13"/>',
  gift: '<path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" d="M4 9h16v4H4zM5 13h14v7H5zM12 9v11M12 9c-2-4-5-4-5-2s3 2 5 2zm0 0c2-4 5-4 5-2s-3 2-5 2z"/>',
  bell: '<path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15L6 16.5zM10 20.5a2 2 0 0 0 4 0"/>'
};
function $(i){ return document.getElementById(i); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ico(name){ var e = el('span', 'ico'); e.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + PATHS[name] + '</svg>'; return e; }
function mono(p, small){ return el('span', 'mono' + (small ? ' s' : ''), p.name.charAt(0).toUpperCase()); }
function iso(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function noon(s){ return new Date(s + 'T12:00:00'); }
function person(id){ return S && S.people.filter(function(p){ return p.id === id; })[0]; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function nextMark(n){ for (var i = 0; i < MARKS.length; i++) if (MARKS[i] > n) return MARKS[i]; return null; }

function api(path, body){
  var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' };
  return fetch(path, opt).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}
function online(ok){ $('conn').classList.toggle('on', !ok); }
function load(){
  if (busy) return;
  api('/state').then(function(s){ S = s; online(true); draw(); }).catch(function(){ online(false); });
}
function setMe(id){ me = id; if (id) localStorage.setItem('eu', id); else localStorage.removeItem('eu'); draw(); }

function message(p, justDone){
  var others = S.people.filter(function(o){ return o.id !== p.id; });
  if (!p.doneToday) {
    var done = others.filter(function(o){ return o.doneToday; });
    return done.length ? done[0].name + ' já registrou hoje.' : 'Ainda não registrado hoje.';
  }
  if (justDone && MARKS.indexOf(p.streak) >= 0) return 'Marco de ' + p.streak + ' dias.';
  return p.streak > 1 ? 'Dia ' + p.streak + ' da sequência.' : 'Começa a sequência.';
}

function draw(justDone){
  var ds = noon(S.today).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  var m = person(me);
  if (!m && me) { me = null; localStorage.removeItem('eu'); }

  $('hello').textContent = m ? m.name : (S.people.length ? 'Quem é você?' : 'Bem-vindos');
  $('pick').hidden = !!m;
  var who = $('who'); who.textContent = '';
  S.people.forEach(function(p){ var b = el('button'); b.appendChild(mono(p)); b.appendChild(document.createTextNode(p.name)); b.onclick = function(){ setMe(p.id); }; who.appendChild(b); });
  $('swap').hidden = !m;

  // Someone reminded me
  var nd = $('nudged'); nd.textContent = '';
  if (m && m.nudgedBy && !m.doneToday) {
    var al = el('div', 'note'); al.appendChild(ico('bell'));
    var ac = el('div'); ac.appendChild(el('b', null, m.nudgedBy + ' lembrou você')); ac.appendChild(el('span', null, 'Falta o devocional de hoje.')); al.appendChild(ac); nd.appendChild(al);
  }

  $('mine').hidden = !m;
  if (m) {
    $('big').className = 'ring' + (m.doneToday ? ' done' : '');
    $('big').setAttribute('aria-pressed', m.doneToday ? 'true' : 'false');
    var core = $('core'); core.textContent = ''; core.appendChild(ico(m.doneToday ? 'check' : 'book'));
    $('cap').textContent = m.doneToday ? 'Registrado hoje' : 'Registrar hoje';
    $('hint').textContent = message(m, justDone);
    $('tog').hidden = !(S.people.length > 1 && S.people.some(function(o){ return !o.doneToday; }));
    var y = $('yday'), ydone = m.week[5];
    y.hidden = false; y.textContent = ydone ? 'Ontem registrado. Desfazer' : 'Esqueci de registrar ontem';
  }

  // People: one quiet row each
  var box = $('people'); box.textContent = '';
  S.people.forEach(function(p){
    var row = el('div', 'person');
    var head = el('div', 'head'); head.appendChild(mono(p, true));
    var w = el('div', 'who2'); w.appendChild(el('div', 'nm', p.name));
    var sub = el('div', 'sub');
    if (p.doneToday) { sub.appendChild(el('span', 'ok', 'Registrado hoje')); } else sub.appendChild(document.createTextNode('Ainda não hoje'));
    sub.appendChild(document.createTextNode('  ·  ' + p.level + (p.grace ? '  ·  dia de graça usado' : '')));
    w.appendChild(sub); head.appendChild(w);
    var st = el('div', 'streak'); st.appendChild(el('div', 'num', String(p.streak))); st.appendChild(el('small', null, p.streak === 1 ? 'dia' : 'dias')); head.appendChild(st);
    row.appendChild(head);
    var wk = el('div', 'week');
    p.week.forEach(function(d, k){
      var day = noon(S.today); day.setDate(day.getDate() - (6 - k));
      var c = el('div', 'day' + (d ? ' y' : '') + (k === 6 ? ' t' : ''));
      c.appendChild(el('i')); c.appendChild(document.createTextNode(day.toLocaleDateString('pt-BR', { weekday: 'narrow' }).toUpperCase()));
      c.setAttribute('aria-label', day.toLocaleDateString('pt-BR', { weekday: 'long' }) + (d ? ': feito' : ': não feito'));
      wk.appendChild(c);
    });
    row.appendChild(wk);
    var foot = el('div', 'foot');
    var left = nextMark(p.best);
    foot.appendChild(el('span', null, plural(p.points, 'ponto', 'pontos') + (left ? '  ·  próximo marco, ' + left + ' dias' : '')));
    if (m && p.id !== m.id && !p.doneToday) {
      var call = el('button', 'call'); call.appendChild(ico('bell')); call.appendChild(document.createTextNode('Lembrar'));
      call.onclick = function(){
        api('/nudge', { from: m.id, to: p.id }).then(function(s2){ S = s2; draw(); $('hint').textContent = p.name + ' foi lembrado.'; })
          .catch(function(){ $('err').textContent = 'Você acabou de lembrar ' + p.name + '. Espere um pouco.'; });
      };
      foot.appendChild(call);
    }
    row.appendChild(foot);
    box.appendChild(row);
  });

  // The pair: the run they share and the week's lead
  var duo = $('duo');
  if (S.people.length > 1) {
    duo.hidden = false; duo.textContent = '';
    var a = el('div'); a.appendChild(el('div', 'num', String(S.together))); a.appendChild(el('small', null, S.together === 1 ? 'dia juntos' : 'dias juntos')); duo.appendChild(a);
    var lead = S.weekLeader && person(S.weekLeader);
    var b2 = el('div'); b2.appendChild(el('div', 'num', lead ? lead.name : 'Empate')); b2.appendChild(el('small', null, 'na frente esta semana')); duo.appendChild(b2);
  } else duo.hidden = true;

  // What the couple promised themselves
  var rwd = $('rewards'); rwd.textContent = '';
  (S.unlocked || []).forEach(function(u){
    var n = el('div', 'note'); n.appendChild(ico('gift'));
    var c = el('div'); c.appendChild(el('b', null, 'Prêmio liberado: ' + u.text)); c.appendChild(el('span', null, 'Vocês chegaram a ' + plural(u.days, 'dia', 'dias') + ' juntos.')); n.appendChild(c);
    var b = el('button', 'call', 'Resgatei'); b.onclick = function(){ api('/reward', { claim: u.days }).then(function(s2){ S = s2; draw(); }).catch(function(){ $('err').textContent = 'Não consegui falar com a TV.'; }); };
    n.appendChild(b); rwd.appendChild(n);
  });
  if (S.nextReward && S.people.length > 1) {
    var nr = el('p', 'nextr'); nr.appendChild(document.createTextNode('Próximo prêmio: ')); nr.appendChild(el('b', null, S.nextReward.text));
    nr.appendChild(document.createTextNode('. Faltam ' + plural(S.nextReward.left, 'dia', 'dias') + ' juntos.')); rwd.appendChild(nr);
  }

  // The tree
  var tr = $('tree'); tr.hidden = !(S.tree && S.people.length);
  if (S.tree) {
    var src = '/tree.svg?stage=' + S.tree.stage; if ($('timg').getAttribute('src') !== src) $('timg').setAttribute('src', src);
    $('tname').textContent = S.tree.name;
    var span = S.tree.next ? S.tree.next - S.tree.from : 1;
    $('tbar').style.width = (S.tree.next ? Math.min(100, Math.round((S.tree.points - S.tree.from) / span * 100)) : 100) + '%';
    $('tnext').textContent = S.tree.next ? plural(S.tree.points, 'ponto', 'pontos') + '  ·  faltam ' + (S.tree.next - S.tree.points) : plural(S.tree.points, 'ponto', 'pontos');
  }

  // Rewards are set here; the fields are left alone while one is being typed in
  var rws = $('rw');
  if (!(document.activeElement && rws.contains(document.activeElement))) {
    rws.textContent = '';
    if (S.people.length > 1) {
      rws.appendChild(el('div', 'eyebrow sect', 'Prêmios do casal'));
      S.rewardDays.forEach(function(k){
        var row = el('label', 'rwrow'); row.appendChild(el('span', null, 'Com ' + k + ' dias juntos'));
        var inp = el('input'); inp.maxLength = 40; inp.placeholder = 'Ex.: jantar a dois'; inp.value = S.rewards[k] || ''; inp.setAttribute('aria-label', 'Prêmio de ' + k + ' dias');
        inp.onchange = function(){ api('/reward', { days: k, text: inp.value }).then(function(s2){ S = s2; }).catch(function(){ $('err').textContent = 'Não consegui salvar o prêmio.'; }); };
        row.appendChild(inp); rws.appendChild(row);
      });
    }
  }
  $('add').hidden = S.people.length >= 4;
  if (!S.people.length) $('more').open = true;
  var rm = $('rm'); rm.textContent = '';
  S.people.forEach(function(p){
    var row = el('div', 'rm'); row.appendChild(el('span', null, p.name));
    var b = el('button', null, 'Remover');
    b.onclick = function(){
      if (!confirm('Remover ' + p.name + ' e todo o histórico dessa pessoa?')) return;
      send('/people', { remove: p.id }).then(function(){ if (me === p.id) setMe(null); });
    };
    row.appendChild(b); rm.appendChild(row);
  });
}

// Taps answer at once and are corrected if the TV refuses or cannot be reached
function send(path, body, optimistic){
  busy = true; $('err').textContent = '';
  var before = JSON.stringify(S);
  if (optimistic) { optimistic(); draw(); }
  return api(path, body).then(function(s){ S = s; online(true); busy = false; draw(true); return s; })
    .catch(function(){ busy = false; S = JSON.parse(before); draw(); $('err').textContent = 'Não consegui falar com a TV. Tente de novo.'; online(false); throw 0; });
}
function toggle(date, done, key){
  var m = person(me); if (!m) return Promise.resolve();
  return send('/checkin', { id: m.id, date: date, done: done }, function(){
    if (key === 'today') { m.doneToday = done; m.week[6] = done; m.total += done ? 1 : -1; m.streak = done ? m.streak + 1 : Math.max(m.streak - 1, 0); m.best = Math.max(m.best, m.streak); }
    else { m.week[5] = done; m.total += done ? 1 : -1; }
  });
}
$('big').onclick = function(){
  var m = person(me); if (!m) return;
  var done = !m.doneToday;
  if (done && navigator.vibrate) navigator.vibrate(18);
  toggle(S.today, done, 'today').catch(function(){});
};
$('yday').onclick = function(){
  var m = person(me); if (!m) return;
  var d = noon(S.today); d.setDate(d.getDate() - 1);
  toggle(iso(d), !m.week[5], 'yday').catch(function(){});
};
$('tog').onclick = function(){
  if (navigator.vibrate) navigator.vibrate(18);
  send('/together', {}, function(){ S.people.forEach(function(o){ if (!o.doneToday) { o.doneToday = true; o.week[6] = true; o.streak += 1; } }); }).catch(function(){});
};
$('swap').onclick = function(){ setMe(null); };
$('add').onsubmit = function(e){
  e.preventDefault();
  var n = $('nm').value.trim(); if (!n) return;
  var first = !S.people.length;
  send('/people', { name: n }).then(function(s){
    $('nm').value = '';
    if (!me) { var added = s.people.filter(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })[0]; if (added && first) setMe(added.id); }
  }).catch(function(){ $('err').textContent = 'Esse nome já existe ou o limite de 4 pessoas foi atingido.'; });
};
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
window.addEventListener('online', load);
load(); setInterval(load, 10000);
</script>
</body>
